name: Verify container

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install check tools
        run: sudo apt-get update && sudo apt-get install -y podman shellcheck
      - name: Check shell scripts
        run: |
          bash -n build-verify-codex.sh codex-sandbox.sh setup.sh tests/test-launcher.sh tests/test-project-home.sh
          shellcheck build-verify-codex.sh codex-sandbox.sh setup.sh tests/test-launcher.sh tests/test-project-home.sh
          git diff --check
          bash tests/test-launcher.sh
      - name: Build and verify image
        env:
          PLATFORM: linux/amd64
        run: ./build-verify-codex.sh
      - name: Verify launcher and writable project mount
        run: |
          SSH_MODE=none PROJECT_DIR="$PWD" ./codex-sandbox.sh --version
          podman run --rm --entrypoint /bin/sh \
            --userns=keep-id:uid=10001,gid=10001 \
            -v "$PWD:/workspace:Z" codex-local:latest \
            -ec 'touch /workspace/.mount-check && rm /workspace/.mount-check'
